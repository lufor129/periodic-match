[project]
name = "periodic-match"
version = "0.1.0"
description = "Lattice-first vs Template Matching vs DINOv3 on periodic SEM/TEM images"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-python-headless>=4.9",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "tabulate>=0.10.0",
]

[project.optional-dependencies]
# 只有 DINOv3 比較需要；Lattice-first 與 ZNCC 只用 numpy／scipy／opencv
dino = [
    "torch>=2.4",
    "transformers>=4.56",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/periodic_match"]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
]
